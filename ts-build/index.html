<!DOCTYPE html>
<html>

<head>
    <title>TypeScript Decorator Demo</title>
</head>

<body>
    <div class="range-container">
        <label for="range">
            Range input styled with Custom CSS proms from the "prop-for-that" library:
            <input type="range" id="range" data-props-for="range" min="0" max="100" value="88" />
        </label>
    </div>

    <label>
        <input type="radio" name="usecase" value="addition" checked>
        Addition
    </label>

    <label>
        <input type="radio" name="usecase" value="kebab">
        PascalCase → kebab-case
    </label>

    <br><br>

    <div id="stringContainer" style="display:none;">
        <input id="pascalInput" placeholder="AbstractComponentStructure">
    </div>

    <br>

    <button id="runBtn">
        UI breakpoint
    </button>

    <hr>

    <p id="result"></p>

    <script src="./dist/bundle.js"></script>
    <script type="module" src="./wailtind.config.js"></script>

</body>

</html>
